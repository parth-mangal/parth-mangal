<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parth Mangal — SDE II @ Blinkit</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #050510;
      --bg-secondary: #0a0a14;
      --accent-gold: #F7C948;
      --accent-cyan: #00D4FF;
      --accent-purple: #8B5CF6;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --blinkit-yellow: #F7C948;
      --zomato-red: #EF4F5F;
      --gameskraft-purple: #A78BFA;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      cursor: none;
    }

    .cursor-dot {
      position: fixed;
      width: 8px;
      height: 8px;
      background: var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: screen;
      box-shadow: 0 0 10px var(--accent-gold);
    }

    .cursor-ring {
      position: fixed;
      width: 32px;
      height: 32px;
      border: 2px solid var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      mix-blend-mode: screen;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(5, 5, 16, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .nav-logo {
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1px;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--accent-gold);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a.active {
      color: var(--accent-gold);
    }

    .nav-links a.active::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .hamburger span {
      width: 24px;
      height: 3px;
      background: var(--text-primary);
      margin: 4px 0;
      border-radius: 2px;
      transition: 0.3s;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(-45deg) translate(-8px, 8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(45deg) translate(-8px, -8px);
    }

    #hero {
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-top: 70px;
    }

    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .hero-title {
      font-size: clamp(48px, 12vw, 140px);
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--accent-gold) 0%, var(--accent-cyan) 50%, var(--accent-purple) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: gradient-shift 6s ease-in-out infinite;
      line-height: 1.2;
    }

    @keyframes gradient-shift {
      0% { background-position: 0% center; }
      50% { background-position: 100% center; }
      100% { background-position: 0% center; }
    }

    .hero-subtitle {
      font-size: 24px;
      color: var(--text-secondary);
      margin-bottom: 40px;
      min-height: 30px;
    }

    .hero-card {
      display: inline-block;
      padding: 20px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      animation: float-up 0.8s ease-out 0.4s both;
    }

    @keyframes float-up {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-card-company {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .hero-card-company .emoji {
      font-size: 24px;
    }

    .hero-card-role {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .hero-card-location {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .scroll-indicator svg {
      width: 24px;
      height: 40px;
      stroke: var(--accent-gold);
      stroke-width: 2;
      fill: none;
      animation: scroll-bounce 2s ease-in-out infinite;
    }

    @keyframes scroll-bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {

      60% {

    section {
      min-height: 100vh;

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CustomCursor() {
      const dotRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (dotRef.current) {
            dotRef.current.style.left = e.clientX - 4 + 'px';
            dotRef.current.style.top = e.clientY - 4 + 'px';
          }
          if (ringRef.current) {
            ringRef.current.style.left = e.clientX - 16 + 'px';
            ringRef.current.style.top = e.clientY - 16 + 'px';
          }
        };

        document.addEventListener('mousemove', handleMouseMove);
        return () => document.removeEventListener('mousemove', handleMouseMove);
      }, []);

      return (
        <>
          <div className="cursor-dot" ref={dotRef}></div>
          <div className="cursor-ring" ref={ringRef}></div>
        </>
      );
    }

    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 200;

        class Particle {
          constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            this.size = Math.random() * 1.5;
            this.opacity = Math.random() * 0.5 + 0.2;
          }

          update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
          }

          draw() {
            ctx.fillStyle = `rgba(247, 201, 72, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let i = 0; i < particleCount; i++) {
          particles.push(new Particle());
        }

        const drawLines = () => {
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const distance = Math.sqrt(dx * dx + dy * dy);

              if (distance < 150) {
                ctx.strokeStyle = `rgba(247, 201, 72, ${0.1 * (1 - distance / 150)})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
              }
            }
          }
        };

        const animate = () => {
          ctx.fillStyle = 'rgba(5, 5, 16, 0.1)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          particles.forEach((particle) => {
            particle.update();
            particle.draw();
          });

          drawLines();
          requestAnimationFrame(animate);
        };

        animate();

        const handleResize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };

        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      return <canvas id="particle-canvas" ref={canvasRef}></canvas>;
    }

    function TypingText() {
      const [displayText, setDisplayText] = useState('');
      const roles = ['Software Engineer II', 'Backend Architect', 'System Designer', 'Problem Solver'];
      const [currentRole, setCurrentRole] = useState(0);
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        const timeout = setTimeout(() => {
          const role = roles[currentRole];

          if (isDeleting) {
            setDisplayText(displayText.slice(0, -1));
            if (displayText.length === 0) {
              setIsDeleting(false);
              setCurrentRole((prev) => (prev + 1) % roles.length);
            }
          } else {
            setDisplayText(role.slice(0, displayText.length + 1));
            if (displayText.length === role.length) {
              setTimeout(() => setIsDeleting(true), 2000);
            }
          }
        }, isDeleting ? 50 : 100);

        return () => clearTimeout(timeout);
      }, [displayText, currentRole, isDeleting]);

      return <div className="hero-subtitle">{displayText}</div>;
    }

    function useScrollAnimation(ref, threshold = 0.2) {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add('fade-in-scroll');
              }
            });
          },
          { threshold }
        );

        if (ref.current) {
          observer.observe(ref.current);
        }

        return () => observer.disconnect();
      }, [ref]);
    }

    function CounterStat({ target, label }) {
      const [count, setCount] = useState(0);
      const ref = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            if (entries[0].isIntersecting) {
              let current = 0;
              const increment = target / 30;
              const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                  setCount(target);
                  clearInterval(timer);
                } else {
                  setCount(Math.floor(current));
                }
              }, 50);
              observer.disconnect();
            }
          },
          { threshold: 0.5 }
        );

        if (ref.current) {
          observer.observe(ref.current);
        }

        return () => observer.disconnect();
      }, [target]);

      return (
        <div ref={ref} className="about-stat">
          <div className="about-stat-number">{count}+</div>
          <div className="about-stat-label">{label}</div>
        </div>
      );
    }
